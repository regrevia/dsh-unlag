- insert:
    - id: dsh-unlag
      name: 'dsh-unlag'

# The button applies edits through this service's transaction, so it has to run
# even when nothing is watched. `base` resolves against the plugin's own
# location, and an installed plugin lives inside app.asar, which the service
# cannot stat — hence the working directory, the one directory that always
# exists on the machine that boots it.
# `root` stays empty: an empty root means this service itself watches no module
# source, so a saved file applies nothing unless the plugin's own automatic
# reload is switched on (it is off by default). To watch source checkouts, add
# their absolute paths to `root` in your own profile patch layer.
- id: hmr
  disabled: false
  config:
    base: !!js 'process.getBuiltinModule("node:url").pathToFileURL(process.cwd()).href'
    root: []
