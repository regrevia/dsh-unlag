name: ci

# One run per branch: a new push cancels the older run for that branch, so CI
# minutes are never spent proving a commit that is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'win/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Off by default: until this repository has a runner on the Windows
      # machine, a dispatched run must still be able to prove the Linux legs
      # instead of sitting queued on a job nothing can pick up.
      windows:
        description: also run the self-hosted Windows job
        type: boolean
        default: false
      # GitHub-hosted Windows: proves the Windows legs on a dispatched run
      # without depending on the shared machine being reachable or free. The
      # self-hosted job above stays opt-in and separate.
      windows_hosted:
        description: also run the GitHub-hosted Windows job
        type: boolean
        default: true
      # Real-app desktop check on the self-hosted Windows machine: reports
      # whether the app, its CLI and a Chromium are installed there, then runs
      # the same loader contract the macOS by-hand run uses.
      desktop:
        description: also run the real-app desktop check on the Windows machine
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Linux legs run on GitHub-hosted runners for every event.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund
      - run: npm test

  # Windows on the self-hosted machine. Trusted events only: a public
  # repository's fork PR would execute arbitrary code on that machine, so
  # pull_request keeps using GitHub-hosted windows-latest (free for public
  # repositories, no minute quota).
  windows:
    name: test (regrevia-win, node on machine)
    if: github.event_name == 'workflow_dispatch' && inputs.windows == true
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 30
    # The machine is shared with other projects on the same Windows user: one
    # job at a time, and never cancel a running one from a newer push.
    concurrency:
      group: ci-regrevia-win-${{ github.ref }}
      cancel-in-progress: false
    # No actions/setup-node here on purpose: this machine's network cannot
    # finish downloading that action archive (codeload times out after three
    # attempts, the job dies in "Set up job" before any test runs). It already
    # has Node installed for its own projects, so the job uses that one and CI
    # reports which version it ran. Version coverage lives on windows-latest.
    steps:
      - uses: actions/checkout@v4

      - name: runner identity
        shell: powershell
        run: |
          Write-Host "::add-mask::$env:USERNAME"
          Write-Host "::add-mask::$env:COMPUTERNAME"
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS"
          Write-Host "ps=$($PSVersionTable.PSVersion)"

      - name: node on this machine
        shell: powershell
        run: |
          node --version
          npm --version
          (Get-Command node).Source

      - run: npm install --no-audit --no-fund
        shell: powershell
      - run: npm test
        shell: powershell

  # Pull-request Windows coverage stays on GitHub-hosted runners; the machine
  # must never run fork code. Public repository: these minutes are not metered.
  windows-pr:
    name: test (windows-latest, node ${{ matrix.node }})
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.windows_hosted != false)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --no-audit --no-fund
      - run: npm test

  # Real-app desktop check on the self-hosted Windows machine. Opt-in: it
  # needs a desktop install there, and it starts the real app and a browser.
  # The probe always succeeds and prints what it found, so a machine without
  # the app produces an answer instead of a red job it cannot fix.
  desktop:
    name: desktop check (regrevia-win)
    if: github.event_name == 'workflow_dispatch' && inputs.desktop == true
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 30
    concurrency:
      group: ci-regrevia-win-desktop-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: probe install
        shell: powershell
        run: node scripts/desktop-e2e.mjs --probe

      # The desktop app is not installed on this machine, so the real-app run
      # borrows the same runtime from npm: the official dsh package boots a real
      # Host that serves the real startup document. Bounded: a machine without
      # registry access fails here in a few minutes instead of hanging the job.
      - name: fetch the runtime when this machine has none
        shell: powershell
        run: |
          $probe = node scripts/desktop-e2e.mjs --json | ConvertFrom-Json
          if ($probe.cli -eq 'missing') {
            npm install -g @deepseek-ai/dsh@next --no-audit --no-fund
          }
          node scripts/desktop-e2e.mjs --probe

      - name: runtime sanity
        shell: powershell
        run: |
          where.exe dsh
          node -e "console.log('node sees', process.version)"
          node -e "import('./scripts/lib/desktop-paths.mjs').then(m => console.log(JSON.stringify(m.resolveRuntime())))"

      # Reported, not gated: the machine has no desktop install, so this run answers "what would
      # the contract see here" instead of turning a missing install into a red job nobody can fix.
      # Install the desktop build on the machine and this step turns green with no code change.
      - name: real-app loader contract
        shell: powershell
        timeout-minutes: 12
        continue-on-error: true
        run: node scripts/loader-contract.mjs
